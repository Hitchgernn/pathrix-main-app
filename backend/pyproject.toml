[project]
name = "pathrix-app"
version = "0.1.0"
description = "PATHRIX backend — WebGIS AI agent for multimodal mobility in Yogyakarta"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "asyncpg>=0.30",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "redis>=5.2",
    "httpx>=0.27",
    "geopandas>=1.0",
    "shapely>=2.0",
    "osmnx>=1.9",
    "networkx>=3.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
